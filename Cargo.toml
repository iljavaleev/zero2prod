[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
actix-web = "4.9"
config = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"]}
uuid = { version = "1.23.1", features = ["v4", "serde"] }
chrono = "0.4.15"

[dependencies.sqlx]
version = "0.9.0"
default-features = false
features = [
    "runtime-tokio", 
    "tls-rustls", 
    "macros", 
    "postgres", 
    "uuid", 
    "chrono", 
    "migrate",
]